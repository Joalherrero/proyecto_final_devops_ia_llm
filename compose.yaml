services:
  django:
    build:
      context: ./django_app
      dockerfile: Containerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-solo-laboratorio-cambiar-antes-de-publicar}
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      TRIAGE_URL: http://triage:8001/triage
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - django_data:/data
    depends_on:
      triage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 6

  triage:
    build:
      context: ./triage_service
      dockerfile: Containerfile
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ./runbooks:/runbooks:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  ollama:
    profiles: ["llm"]
    image: docker.io/ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  django_data:
  ollama_data:
